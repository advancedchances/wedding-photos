<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Share Your Photos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 420px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 20px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.7;
    }

    .name-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .name-input::placeholder { color: rgba(255,255,255,0.4); }
    .name-input:focus { border-color: rgba(255,255,255,0.4); }

    .upload-zone {
      border: 2px dashed rgba(255,255,255,0.25);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255,255,255,0.04);
      margin-bottom: 16px;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.08);
    }

    .upload-zone .icon { font-size: 48px; margin-bottom: 12px; }
    .upload-zone .label { font-size: 16px; font-weight: 600; }
    .upload-zone .sublabel { font-size: 13px; opacity: 0.5; margin-top: 6px; }

    input[type="file"] { display: none; }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .preview-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 1;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-item .status-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .status-badge.pending { background: rgba(0,0,0,0.5); }
    .status-badge.uploading { background: #f59e0b; }
    .status-badge.done { background: #10b981; }
    .status-badge.error { background: #ef4444; }

    .upload-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: #6366f1;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .upload-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .upload-btn:not(:disabled):hover { opacity: 0.9; }

    .status-bar {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      opacity: 0.7;
      min-height: 20px;
    }

    .done-message {
      text-align: center;
      padding: 32px 20px;
      background: rgba(16, 185, 129, 0.12);
      border-radius: 16px;
      margin-top: 16px;
    }

    .done-message .check { font-size: 48px; margin-bottom: 10px; }
    .done-message p { font-size: 15px; opacity: 0.8; }
    .preview-item video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
    .preview-item .play { position: absolute; left: 6px; bottom: 4px; font-size: 14px; text-shadow: 0 0 4px #000; }
    .status-badge.uploading.pct { width: auto; padding: 0 6px; border-radius: 11px; font-size: 11px; font-weight: 600; }
    .keep-open { text-align: center; font-size: 13px; color: #fbbf24; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Share Your Photos &amp; Videos</h1>
      <p>Tap below to upload from this event</p>
    </div>

    <input class="name-input" id="nameInput" type="text"
           placeholder="Your name (optional)" autocomplete="name">

    <input class="name-input" id="emailInput" type="email"
           placeholder="Email to get the full album (optional)" autocomplete="email">

    <div class="upload-zone" id="dropZone">
      <div class="icon">&#128247;</div>
      <div class="label">Tap to select photos or videos</div>
      <div class="sublabel">or take new ones with your camera</div>
    </div>

    <input type="file" id="fileInput" accept="image/*,video/*" multiple>

    <div class="preview-grid" id="previewGrid"></div>

    <button class="upload-btn" id="uploadBtn" disabled>Upload</button>

    <div class="status-bar" id="statusBar"></div>
    <div class="keep-open" id="keepOpen">Keep this page open until uploads finish</div>
    <div id="doneArea"></div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewGrid = document.getElementById('previewGrid');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusBar = document.getElementById('statusBar');
    const keepOpen = document.getElementById('keepOpen');
    const doneArea = document.getElementById('doneArea');
    const nameInput = document.getElementById('nameInput');
    const emailInput = document.getElementById('emailInput');

    const EXEC_URL = 'https://script.google.com/macros/s/AKfycbyjiLTzGf8XIfjN4K3-YtCHS1GlVDkFH_1WxAG30GiBGQzSXPge2AElDuMlpPegq9fP/exec';
    const CHUNK_SIZE = 16 * 1024 * 1024; // Drive needs pieces in multiples of 256 KB
    const PARALLEL = 3;                 // files uploading at once
    const PHOTO_MAX = 3072;             // long side in px (~7 MP) for large photos
    const PHOTO_QUALITY = 0.9;
    const SHRINK_ABOVE = 2.5 * 1024 * 1024; // smaller photos are sent untouched

    async function callScript(payload) {
      const res = await fetch(EXEC_URL, { method: 'POST', body: JSON.stringify(payload) });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'Upload failed');
      return json;
    }

    let selectedFiles = [];

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
      fileInput.value = '';
    });

    function isVideo(file) {
      return file.type.startsWith('video/') || /\.(mov|mp4|m4v|3gp|webm|mkv)$/i.test(file.name);
    }

    function isImage(file) {
      return file.type.startsWith('image/') || /\.(jpe?g|png|heic|heif|webp|dng)$/i.test(file.name);
    }

    function handleFiles(files) {
      doneArea.innerHTML = '';
      for (const file of files) {
        if (!isImage(file) && !isVideo(file)) continue;
        const item = { file, status: 'pending', video: isVideo(file), url: URL.createObjectURL(file) };
        selectedFiles.push(item);
        addPreview(item);
      }
      updateButton('Upload');
    }

    function updateButton(verb) {
      const n = selectedFiles.length;
      uploadBtn.disabled = n === 0;
      uploadBtn.textContent = n ? `${verb} ${n} File${n !== 1 ? 's' : ''}` : 'Upload';
    }

    function addPreview(item) {
      const div = document.createElement('div');
      div.className = 'preview-item';
      if (item.video) {
        const v = document.createElement('video');
        v.src = item.url + '#t=0.1';
        v.muted = true;
        v.playsInline = true;
        v.preload = 'metadata';
        div.appendChild(v);
        const play = document.createElement('div');
        play.className = 'play';
        play.textContent = '▶';
        div.appendChild(play);
      } else {
        const img = document.createElement('img');
        img.src = item.url;
        div.appendChild(img);
      }
      const badge = document.createElement('div');
      div.appendChild(badge);
      item.el = div;
      item.badge = badge;
      setStatus(item, item.status);
      previewGrid.appendChild(div);
    }

    function setStatus(item, status, pct) {
      item.status = status;
      const b = item.badge;
      b.className = `status-badge ${status}`;
      if (status === 'done') b.textContent = '✓';
      else if (status === 'error') b.textContent = '✗';
      else if (status === 'uploading' && pct !== undefined) {
        b.classList.add('pct');
        b.textContent = `${pct}%`;
      } else if (status === 'uploading') b.textContent = '…';
      else b.textContent = '';
    }

    function readAsBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = () => reject(new Error('Could not read file'));
        reader.readAsDataURL(blob);
      });
    }

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
        img.src = url;
      });
    }

    // Large photos are resized to PHOTO_MAX at high quality. Returns null to send the original
    // (small photo, a format the browser can't decode, or no size saving).
    async function shrinkPhoto(file) {
      if (file.size <= SHRINK_ABOVE) return null;
      const img = await loadImage(file);
      const ratio = Math.min(1, PHOTO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * ratio);
      canvas.height = Math.round(img.naturalHeight * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const jpeg = await new Promise(r => canvas.toBlob(r, 'image/jpeg', PHOTO_QUALITY));
      if (!jpeg || jpeg.size >= file.size) return null;
      const exif = await readExif(file).catch(() => null);
      return exif ? new Blob([jpeg.slice(0, 2), exif, jpeg.slice(2)], { type: 'image/jpeg' }) : jpeg;
    }

    // Copies the original's EXIF block (date taken, camera) so the album sorts by when photos were shot.
    async function readExif(file) {
      const bytes = new Uint8Array(await file.slice(0, 256 * 1024).arrayBuffer());
      if (bytes[0] !== 0xFF || bytes[1] !== 0xD8) return null;
      let o = 2;
      while (o + 4 < bytes.length && bytes[o] === 0xFF) {
        const marker = bytes[o + 1];
        const len = (bytes[o + 2] << 8) | bytes[o + 3];
        if (marker === 0xDA) break;
        if (marker === 0xE1 && String.fromCharCode(...bytes.slice(o + 4, o + 8)) === 'Exif') {
          if (o + 2 + len > bytes.length) return null;
          const seg = bytes.slice(o, o + 2 + len);
          resetOrientation(seg);
          return seg;
        }
        o += 2 + len;
      }
      return null;
    }

    // The resized image is already drawn upright, so the copied EXIF must not rotate it again.
    function resetOrientation(seg) {
      const t = 10; // TIFF header: after FF E1, length, "Exif\0\0"
      const le = seg[t] === 0x49;
      const u16 = (i) => le ? seg[i] | (seg[i + 1] << 8) : (seg[i] << 8) | seg[i + 1];
      const u32 = (i) => (le
        ? seg[i] | (seg[i + 1] << 8) | (seg[i + 2] << 16) | (seg[i + 3] << 24)
        : (seg[i] << 24) | (seg[i + 1] << 16) | (seg[i + 2] << 8) | seg[i + 3]) >>> 0;
      const ifd = t + u32(t + 4);
      if (ifd + 2 > seg.length) return;
      const count = u16(ifd);
      for (let k = 0; k < count; k++) {
        const e = ifd + 2 + k * 12;
        if (e + 12 > seg.length) return;
        if (u16(e) === 0x0112) {
          seg[e + 8] = le ? 1 : 0;
          seg[e + 9] = le ? 0 : 1;
        }
      }
    }

    // Small files go in one request; big ones (videos) go in 16 MB pieces. If a piece fails,
    // asks Drive how much it already has and carries on from there.
    async function uploadFile(item, index, uploaderName, onProgress) {
      const original = item.file;
      const fallbackExt = item.video ? '.mp4' : '.jpg';
      let ext = (original.name.match(/\.[a-z0-9]+$/i) || [fallbackExt])[0].toLowerCase();
      let mimeType = original.type || (item.video ? 'video/mp4' : 'image/jpeg');
      let file = original;
      if (!item.video) {
        const smaller = await shrinkPhoto(original).catch(() => null);
        if (smaller) {
          file = smaller;
          ext = '.jpg';
          mimeType = 'image/jpeg';
        }
      }
      const total = file.size;
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      const filename = `${item.video ? 'video' : 'photo'}_${timestamp}_${index}${ext}`;

      if (total <= CHUNK_SIZE) {
        const data = await readAsBase64(file);
        for (let attempt = 1; ; attempt++) {
          try {
            await callScript({ action: 'upload', data, filename, mimeType, name: uploaderName });
            return;
          } catch (err) {
            if (attempt >= 4) throw err;
            await sleep(1500 * attempt);
          }
        }
      }

      const { uploadId } = await callScript({ action: 'startUpload', filename, mimeType, size: total, name: uploaderName });

      let offset = 0;
      let failures = 0;
      while (true) {
        try {
          const data = await readAsBase64(file.slice(offset, offset + CHUNK_SIZE));
          const res = await callScript({ action: 'uploadChunk', uploadId, data, offset, total });
          if (res.done) return;
          offset = res.next;
          failures = 0;
          onProgress(Math.min(99, Math.floor(offset / total * 100)));
        } catch (err) {
          console.error(err);
          if (++failures > 5) throw err;
          await sleep(2000 * failures);
          const status = await callScript({ action: 'uploadStatus', uploadId, total }).catch(() => null);
          if (status && status.done) return;
          if (status) offset = status.next;
        }
      }
    }

    async function keepScreenOn() {
      try { return await navigator.wakeLock.request('screen'); } catch (e) { return null; }
    }

    uploadBtn.addEventListener('click', async () => {
      uploadBtn.disabled = true;
      keepOpen.style.display = 'block';
      const wakeLock = await keepScreenOn();
      const uploaderName = nameInput.value.trim();
      const total = selectedFiles.length;
      let uploaded = 0;

      let next = 0;
      let finished = 0;
      const showProgress = () => {
        statusBar.textContent = `Uploading... ${finished} of ${total} done`;
      };
      showProgress();

      async function worker() {
        while (next < total) {
          const i = next++;
          const item = selectedFiles[i];
          setStatus(item, 'uploading', item.file.size > CHUNK_SIZE ? 0 : undefined);
          try {
            await uploadFile(item, i, uploaderName, (pct) => setStatus(item, 'uploading', pct));
            setStatus(item, 'done');
            uploaded++;
          } catch (err) {
            console.error(err);
            setStatus(item, 'error');
          }
          finished++;
          showProgress();
        }
      }
      await Promise.all(Array.from({ length: Math.min(PARALLEL, total) }, worker));

      if (wakeLock) wakeLock.release().catch(() => {});
      keepOpen.style.display = 'none';
      statusBar.textContent = '';
      const email = emailInput.value.trim();
      if (uploaded > 0 && (uploaderName || email)) {
        callScript({ action: 'log', name: uploaderName, email, count: uploaded }).catch(console.error);
      }

      const failed = selectedFiles.filter(f => f.status === 'error');
      if (failed.length === 0) {
        selectedFiles = [];
        previewGrid.innerHTML = '';
        updateButton('Upload');
        doneArea.innerHTML = `
          <div class="done-message">
            <div class="check">✅</div>
            <h2>${uploaded} file${uploaded !== 1 ? 's' : ''} uploaded!</h2>
            <p>Thank you for sharing your memories. Tap above to add more.</p>
          </div>`;
      } else {
        statusBar.textContent = `${uploaded} of ${total} uploaded. Tap Retry for the rest.`;
        selectedFiles.filter(f => f.status === 'done').forEach(f => f.el.remove());
        selectedFiles = failed;
        failed.forEach(f => setStatus(f, 'pending'));
        updateButton('Retry');
      }
    });
  </script>
</body>
</html>
